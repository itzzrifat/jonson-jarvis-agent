<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>JARVIS — Jonson AI Cloud</title>
  
  <!-- Apple iOS Web App Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JARVIS">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/iron-man.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#030712">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #030712;
      --cyan: #00f2fe;
      --blue: #4facfe;
      --glow: rgba(0, 242, 254, 0.45);
      --card-bg: rgba(15, 23, 42, 0.75);
      --border: rgba(0, 242, 254, 0.2);
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-top: env(safe-area-inset-top, 20px);
      padding-bottom: env(safe-area-inset-bottom, 20px);
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(0, 242, 254, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 50% 90%, rgba(79, 70, 229, 0.08) 0%, transparent 50%);
    }

    /* Top HUD Bar */
    header {
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .brand-title {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 18px;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #00f2fe, #4facfe, #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .online-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-family: 'Orbitron', monospace;
      letter-spacing: 0.5px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Arc Reactor Main Section */
    .reactor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      position: relative;
    }

    .arc-reactor {
      width: 250px;
      height: 250px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    /* Outer Ring */
    .ring-outer {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px dashed rgba(0, 242, 254, 0.3);
      animation: rotate-cw 20s linear infinite;
    }

    /* Middle Segmented Ring */
    .ring-middle {
      position: absolute;
      width: 82%;
      height: 82%;
      border-radius: 50%;
      border: 3px solid rgba(0, 242, 254, 0.15);
      border-top-color: var(--cyan);
      border-bottom-color: var(--blue);
      animation: rotate-ccw 12s linear infinite;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
    }

    /* Core Glowing Center */
    .reactor-core {
      width: 58%;
      height: 58%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.4) 0%, rgba(79, 70, 229, 0.2) 60%, rgba(3, 7, 18, 0.9) 100%);
      border: 2px solid var(--cyan);
      box-shadow: 0 0 30px var(--glow), inset 0 0 20px var(--glow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2;
    }

    .reactor-core.listening {
      border-color: #f43f5e;
      box-shadow: 0 0 45px rgba(244, 63, 94, 0.6), inset 0 0 25px rgba(244, 63, 94, 0.4);
      animation: pulse-core 1.2s infinite alternate;
    }

    .reactor-core.speaking {
      border-color: #10b981;
      box-shadow: 0 0 45px rgba(16, 185, 129, 0.6), inset 0 0 25px rgba(16, 185, 129, 0.4);
      animation: pulse-core 0.8s infinite alternate;
    }

    @keyframes pulse-core {
      0% { transform: scale(0.96); }
      100% { transform: scale(1.05); }
    }

    @keyframes rotate-cw {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes rotate-ccw {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    .mic-icon {
      font-size: 38px;
      color: var(--cyan);
      filter: drop-shadow(0 0 8px var(--cyan));
      transition: all 0.3s ease;
    }

    .status-text {
      margin-top: 10px;
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    /* Soundwave Visualizer */
    .waveform {
      display: flex;
      gap: 4px;
      align-items: center;
      height: 24px;
      margin-top: 16px;
    }

    .wave-bar {
      width: 3px;
      height: 6px;
      background: var(--cyan);
      border-radius: 3px;
      transition: height 0.15s ease;
      box-shadow: 0 0 6px var(--cyan);
    }

    .waveform.active .wave-bar {
      animation: bounce 0.6s infinite alternate;
    }

    .waveform.active .wave-bar:nth-child(2) { animation-delay: 0.1s; }
    .waveform.active .wave-bar:nth-child(3) { animation-delay: 0.2s; }
    .waveform.active .wave-bar:nth-child(4) { animation-delay: 0.3s; }
    .waveform.active .wave-bar:nth-child(5) { animation-delay: 0.15s; }
    .waveform.active .wave-bar:nth-child(6) { animation-delay: 0.25s; }
    .waveform.active .wave-bar:nth-child(7) { animation-delay: 0.05s; }

    @keyframes bounce {
      0% { height: 4px; }
      100% { height: 22px; }
    }

    /* Assistant Dialogue Box */
    .dialogue-card {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px 20px;
      margin-top: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .dialogue-speaker {
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--cyan);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dialogue-text {
      font-size: 15px;
      line-height: 1.5;
      color: var(--text);
      max-height: 140px;
      overflow-y: auto;
    }

    /* Quick Action Pills */
    .quick-actions {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .quick-actions::-webkit-scrollbar { display: none; }

    .action-pill {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(0, 242, 254, 0.25);
      color: #e2e8f0;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .action-pill:active {
      transform: scale(0.96);
      background: rgba(0, 242, 254, 0.2);
    }

    /* Bottom Input Bar */
    .input-bar {
      display: flex;
      gap: 10px;
      padding: 12px 20px 16px 20px;
      background: rgba(3, 7, 18, 0.85);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .input-bar input {
      flex: 1;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 12px 18px;
      color: #fff;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }

    .input-bar input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
    }

    .send-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      border: none;
      color: #030712;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
      transition: all 0.2s ease;
    }

    .send-btn:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <!-- Top HUD Header -->
  <header>
    <div class="brand-title">
      <span>⚡</span> JARVIS AI
    </div>
    <div class="online-indicator">
      <span class="live-dot"></span> 24/7 CLOUD
    </div>
  </header>

  <!-- Arc Reactor Center -->
  <main class="reactor-container">
    <div class="arc-reactor" id="reactorBtn">
      <div class="ring-outer"></div>
      <div class="ring-middle"></div>
      <div class="reactor-core" id="reactorCore">
        <div class="mic-icon" id="micIcon">🎙️</div>
        <div class="status-text" id="statusLabel">STANDBY</div>
      </div>
    </div>

    <!-- Live Audio Waves -->
    <div class="waveform" id="waveform">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>

    <!-- Dialogue Output Box -->
    <div class="dialogue-card">
      <div class="dialogue-speaker" id="speakerLabel">
        <span>🤖</span> JONSON CLOUD • RIFAT UDDIN'S CHIEF OF STAFF
      </div>
      <div class="dialogue-text" id="dialogueText">
        "আসসালামু আলাইকুম রিফাত ভাই। আমি প্রস্তুত। মুখে কথা বলতে আর্করিয়েক্টরে ট্যাপ করুন।"
      </div>
    </div>
  </main>

  <!-- Quick Action Pills -->
  <section class="quick-actions">
    <button class="action-pill" onclick="sendQuickPrompt('আজকের সহজ কারবার হিসাব ও কালেকশন কত?')">
      📊 আজকের কালেকশন
    </button>
    <button class="action-pill" onclick="sendQuickPrompt('আমার আজকের পেন্ডিং কাজের তালিকা দেখাও')">
      📋 পেন্ডিং টাস্ক
    </button>
    <button class="action-pill" onclick="sendQuickPrompt('ফেসবুক অটো-গ্রোথ সাইকেল রান করো')">
      🚀 ফেসবুক গ্রোথ
    </button>
    <button class="action-pill" onclick="sendQuickPrompt('মর্নিং এক্সিকিউটিভ ব্রিফিং দাও')">
      🌅 Morning Briefing
    </button>
  </section>

  <!-- Bottom Input Bar -->
  <footer class="input-bar">
    <input type="text" id="textInput" placeholder="মুখে কথা বলুন বা বাংলায় লিখুন..." autocomplete="off">
    <button class="send-btn" id="sendBtn" onclick="submitTextInput()">➤</button>
  </footer>

  <script>
    const reactorBtn = document.getElementById('reactorBtn');
    const reactorCore = document.getElementById('reactorCore');
    const micIcon = document.getElementById('micIcon');
    const statusLabel = document.getElementById('statusLabel');
    const dialogueText = document.getElementById('dialogueText');
    const waveform = document.getElementById('waveform');
    const textInput = document.getElementById('textInput');

    let isListening = false;
    let recognition = null;

    // 1. Initialize Speech Recognition (Supported in iOS Safari)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'bn-BD'; // Primary Bengali, handles English naturally

      recognition.onstart = () => {
        isListening = true;
        reactorCore.className = 'reactor-core listening';
        statusLabel.innerText = 'LISTENING';
        micIcon.innerText = '🔴';
        waveform.className = 'waveform active';
        dialogueText.innerText = "শুনছি রিফাত ভাই, বলুন...";
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        console.log('[SpeechIn]', transcript);
        dialogueText.innerText = `🗣️ "${transcript}"`;
        processUserQuery(transcript);
      };

      recognition.onerror = (event) => {
        console.warn('[SpeechError]', event.error);
        resetState();
        if (event.error !== 'no-speech') {
          dialogueText.innerText = "ভয়েস ডিটেক্ট হয়নি। আবার ট্যাপ করে বলুন বা নিচে লিখে পাঠান।";
        }
      };

      recognition.onend = () => {
        if (reactorCore.className.includes('listening')) {
          resetState();
        }
      };
    }

    function toggleListening() {
      if (!recognition) {
        alert('আপনার ব্রাউজারে স্পিচ রিকগনিশন সাপোর্ট নেই। নিচের টেক্সট বক্স ব্যবহার করুন।');
        return;
      }

      if (isListening) {
        recognition.stop();
        resetState();
      } else {
        try {
          recognition.start();
        } catch (e) {
          recognition.stop();
          setTimeout(() => recognition.start(), 200);
        }
      }
    }

    reactorBtn.addEventListener('click', toggleListening);

    function resetState() {
      isListening = false;
      reactorCore.className = 'reactor-core';
      statusLabel.innerText = 'STANDBY';
      micIcon.innerText = '🎙️';
      waveform.className = 'waveform';
    }

    // 2. Process Query with Cloud API
    async function processUserQuery(query) {
      reactorCore.className = 'reactor-core';
      statusLabel.innerText = 'THINKING';
      micIcon.innerText = '🧠';
      waveform.className = 'waveform';

      try {
        const res = await fetch('/api/jarvis/voice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: query })
        });

        const data = await res.json();
        const reply = data.reply || 'দুঃখিত, কোনো উত্তর পাওয়া যায়নি।';
        dialogueText.innerHTML = reply.replace(/\n/g, '<br>');

        // Voice output via SpeechSynthesis
        speakResponse(data.spoken || reply);
      } catch (err) {
        console.error(err);
        dialogueText.innerText = "সার্ভারে কানেক্ট হতে সমস্যা হয়েছে।";
        resetState();
      }
    }

    // 3. Speech Synthesis (Calm Assistant Voice)
    function speakResponse(text) {
      if (!('speechSynthesis' in window)) {
        resetState();
        return;
      }

      window.speechSynthesis.cancel();
      const cleanText = text.replace(/<[^>]*>?/gm, '').replace(/[*#`_]/g, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'bn-BD';
      utterance.rate = 0.95; // Calm and dignified pace

      utterance.onstart = () => {
        reactorCore.className = 'reactor-core speaking';
        statusLabel.innerText = 'SPEAKING';
        micIcon.innerText = '🔊';
        waveform.className = 'waveform active';
      };

      utterance.onend = () => {
        resetState();
      };

      utterance.onerror = () => {
        resetState();
      };

      window.speechSynthesis.speak(utterance);
    }

    // 4. Text Input Submission
    function submitTextInput() {
      const q = textInput.value.trim();
      if (!q) return;
      textInput.value = '';
      dialogueText.innerText = `🗣️ "${q}"`;
      processUserQuery(q);
    }

    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitTextInput();
    });

    function sendQuickPrompt(prompt) {
      dialogueText.innerText = `🗣️ "${prompt}"`;
      processUserQuery(prompt);
    }
  </script>
</body>
</html>

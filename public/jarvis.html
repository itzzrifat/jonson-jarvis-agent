<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>JARVIS — Jonson AI Cloud</title>
  
  <!-- Apple iOS Web App Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JARVIS">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/iron-man.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#030712">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #030712;
      --cyan: #00f2fe;
      --blue: #4facfe;
      --glow: rgba(0, 242, 254, 0.45);
      --card-bg: rgba(15, 23, 42, 0.85);
      --border: rgba(0, 242, 254, 0.25);
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-top: env(safe-area-inset-top, 20px);
      padding-bottom: env(safe-area-inset-bottom, 20px);
      background-image: 
        radial-gradient(circle at 50% 25%, rgba(0, 242, 254, 0.15) 0%, transparent 65%),
        radial-gradient(circle at 50% 85%, rgba(79, 70, 229, 0.1) 0%, transparent 55%);
    }

    /* Top HUD Bar */
    header {
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .brand-title {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 18px;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #00f2fe, #4facfe, #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .online-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #10b981;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-family: 'Orbitron', monospace;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Arc Reactor Main Section */
    .reactor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 20px;
      position: relative;
    }

    .arc-reactor {
      width: 250px;
      height: 250px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }

    .ring-outer {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px dashed rgba(0, 242, 254, 0.35);
      animation: rotate-cw 20s linear infinite;
    }

    .ring-middle {
      position: absolute;
      width: 82%;
      height: 82%;
      border-radius: 50%;
      border: 3px solid rgba(0, 242, 254, 0.2);
      border-top-color: var(--cyan);
      border-bottom-color: var(--blue);
      animation: rotate-ccw 10s linear infinite;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.25);
    }

    .reactor-core {
      width: 58%;
      height: 58%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.45) 0%, rgba(79, 70, 229, 0.25) 60%, rgba(3, 7, 18, 0.95) 100%);
      border: 2px solid var(--cyan);
      box-shadow: 0 0 35px var(--glow), inset 0 0 25px var(--glow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 2;
    }

    .reactor-core.listening {
      border-color: #f43f5e;
      box-shadow: 0 0 50px rgba(244, 63, 94, 0.7), inset 0 0 30px rgba(244, 63, 94, 0.5);
      animation: pulse-core 0.9s infinite alternate;
    }

    .reactor-core.speaking {
      border-color: #10b981;
      box-shadow: 0 0 50px rgba(16, 185, 129, 0.7), inset 0 0 30px rgba(16, 185, 129, 0.5);
      animation: pulse-core 0.8s infinite alternate;
    }

    .reactor-core.thinking {
      border-color: #f59e0b;
      box-shadow: 0 0 50px rgba(245, 158, 11, 0.7), inset 0 0 30px rgba(245, 158, 11, 0.5);
      animation: pulse-core 0.7s infinite alternate;
    }

    @keyframes pulse-core {
      0% { transform: scale(0.96); }
      100% { transform: scale(1.06); }
    }

    @keyframes rotate-cw {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes rotate-ccw {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    .mic-icon {
      font-size: 38px;
      color: var(--cyan);
      filter: drop-shadow(0 0 8px var(--cyan));
      transition: all 0.2s ease;
    }

    .status-text {
      margin-top: 10px;
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      text-transform: uppercase;
      font-weight: 700;
    }

    /* Soundwave Visualizer */
    .waveform {
      display: flex;
      gap: 5px;
      align-items: center;
      height: 28px;
      margin-top: 16px;
    }

    .wave-bar {
      width: 4px;
      height: 6px;
      background: var(--cyan);
      border-radius: 4px;
      transition: height 0.15s ease;
      box-shadow: 0 0 8px var(--cyan);
    }

    .waveform.active .wave-bar {
      animation: bounce 0.5s infinite alternate;
    }

    .waveform.active .wave-bar:nth-child(1) { animation-delay: 0.1s; }
    .waveform.active .wave-bar:nth-child(2) { animation-delay: 0.25s; }
    .waveform.active .wave-bar:nth-child(3) { animation-delay: 0.05s; }
    .waveform.active .wave-bar:nth-child(4) { animation-delay: 0.3s; }
    .waveform.active .wave-bar:nth-child(5) { animation-delay: 0.15s; }
    .waveform.active .wave-bar:nth-child(6) { animation-delay: 0.2s; }
    .waveform.active .wave-bar:nth-child(7) { animation-delay: 0.35s; }

    @keyframes bounce {
      0% { height: 6px; }
      100% { height: 26px; }
    }

    /* Dialogue Card */
    .dialogue-card {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px 20px;
      margin-top: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      min-height: 95px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .dialogue-speaker {
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      letter-spacing: 1.2px;
      color: var(--cyan);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .dialogue-text {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text);
      max-height: 140px;
      overflow-y: auto;
    }

    /* Quick Action Pills */
    .quick-actions {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .quick-actions::-webkit-scrollbar { display: none; }

    .action-pill {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(0, 242, 254, 0.3);
      color: #e2e8f0;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .action-pill:active {
      transform: scale(0.95);
      background: rgba(0, 242, 254, 0.25);
    }

    /* Voice Persona Pills */
    .voice-selector {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 0 20px;
      margin-top: 14px;
      margin-bottom: 2px;
    }

    .voice-pill {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-dim);
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .voice-pill.active {
      background: rgba(0, 242, 254, 0.18);
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.25);
    }

    /* Bottom Input Bar */
    .input-bar {
      display: flex;
      gap: 10px;
      padding: 12px 20px 16px 20px;
      background: rgba(3, 7, 18, 0.9);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .mic-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      color: var(--cyan);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
      transition: all 0.2s ease;
    }

    .mic-btn.active {
      background: #f43f5e;
      color: #fff;
      border-color: #f43f5e;
      box-shadow: 0 0 15px rgba(244, 63, 94, 0.6);
      animation: pulse-core 0.8s infinite alternate;
    }

    .input-bar input {
      flex: 1;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 12px 18px;
      color: #fff;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }

    .input-bar input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
    }

    .send-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      border: none;
      color: #030712;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
      transition: all 0.2s ease;
    }

    .send-btn:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <!-- Top HUD Header -->
  <header>
    <div class="brand-title">
      <span>⚡</span> JARVIS AI
    </div>
    <div class="online-indicator">
      <span class="live-dot"></span> 24/7 CLOUD LIVE
    </div>
  </header>

  <!-- Arc Reactor Center -->
  <main class="reactor-container">
    <div class="arc-reactor" id="reactorBtn" title="কথা বলতে ট্যাপ করুন">
      <div class="ring-outer"></div>
      <div class="ring-middle"></div>
      <div class="reactor-core" id="reactorCore">
        <div class="mic-icon" id="micIcon">🎙️</div>
        <div class="status-text" id="statusLabel">STANDBY</div>
      </div>
    </div>

    <!-- Live Audio Waves -->
    <div class="waveform" id="waveform">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>

    <!-- Dialogue Output Box -->
    <div class="dialogue-card">
      <div class="dialogue-speaker" id="speakerLabel">
        <span>🤖</span> JONSON CLOUD • BANGLA VOICE SKILL (CHARON)
      </div>
      <div class="dialogue-text" id="dialogueText">
        "আসসালামু আলাইকুম রিফাত ভাই। আমি সম্পূর্ণ প্রস্তুত। কথা বলতে আর্করিয়েক্টরে একবার ট্যাপ করুন।"
      </div>
    </div>
  </main>

  <!-- Voice Persona Selector -->
  <div class="voice-selector">
    <button class="voice-pill active" id="voicePuck" onclick="setVoice('Puck')">🎙️ Gemini পুরুষ (Puck)</button>
    <button class="voice-pill" id="voiceAoede" onclick="setVoice('Aoede')">🎙️ Gemini নারী (Aoede)</button>
    <button class="voice-pill" id="voiceCharon" onclick="setVoice('Charon')">🎙️ রাশভারী (Charon)</button>
  </div>

  <!-- Quick Action Pills -->
  <section class="quick-actions">
    <button class="action-pill" onclick="sendQuickPrompt('আজকের সহজ কারবার হিসাব ও ক্যাশ কালেকশন কত?')">
      📊 আজকের কালেকশন
    </button>
    <button class="action-pill" onclick="sendQuickPrompt('আমার আজকের পেন্ডিং কাজের তালিকা দেখাও')">
      📋 পেন্ডিং টাস্ক
    </button>
    <button class="action-pill" onclick="sendQuickPrompt('মর্নিং এক্সিকিউটিভ ব্রিফিং দাও')">
      🌅 Morning Briefing
    </button>
    <button class="action-pill" onclick="sendQuickPrompt('ফেসবুকে নতুন পোস্টের আইডিয়া দাও')">
      ✍️ ফেসবুক আইডিয়া
    </button>
  </section>

  <!-- Bottom Input Bar -->
  <footer class="input-bar">
    <button class="mic-btn" id="bottomMicBtn" onclick="toggleRecording()" title="কথা বলুন">🎙️</button>
    <input type="text" id="textInput" placeholder="মুখে কথা বলুন বা বাংলায় লিখুন..." autocomplete="off">
    <button class="send-btn" id="sendBtn" onclick="submitTextInput()">➤</button>
  </footer>

  <script>
    const reactorBtn = document.getElementById('reactorBtn');
    const bottomMicBtn = document.getElementById('bottomMicBtn');
    const reactorCore = document.getElementById('reactorCore');
    const micIcon = document.getElementById('micIcon');
    const statusLabel = document.getElementById('statusLabel');
    const dialogueText = document.getElementById('dialogueText');
    const waveform = document.getElementById('waveform');
    const textInput = document.getElementById('textInput');

    let isRecording = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let currentAudio = null;
    let unlockedAudio = null;
    let isAudioUnlocked = false;

    // 1. Prime / Unlock iOS Safari HTML5 Audio on user touch/click
    function unlockAudio() {
      if (isAudioUnlocked) return;
      try {
        if (!unlockedAudio) {
          unlockedAudio = new Audio();
        }
        unlockedAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
        const p = unlockedAudio.play();
        if (p && typeof p.then === 'function') {
          p.then(() => {
            unlockedAudio.pause();
            isAudioUnlocked = true;
          }).catch(() => {});
        } else {
          isAudioUnlocked = true;
        }
      } catch (e) {}
    }

    ['touchstart', 'touchend', 'mousedown', 'click'].forEach(evt => {
      window.addEventListener(evt, unlockAudio, { passive: true });
    });

    // 1. Voice Recording Toggle (MediaRecorder API with Web Speech fallback)
    async function toggleRecording() {
      unlockAudio();

      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    }

    reactorBtn.addEventListener('click', toggleRecording);

    async function startRecording() {
      audioChunks = [];

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(track => track.stop());
          const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          if (audioBlob.size > 1000) {
            uploadAudioQuery(audioBlob);
          } else {
            resetState();
            dialogueText.innerText = "ভয়েস পাওয়া যায়নি। আবার চেষ্টা করুন।";
          }
        };

        mediaRecorder.start();
        isRecording = true;
        setListeningState();
      } catch (err) {
        console.warn('[MicError] Fallback to SpeechRecognition:', err.message);
        fallbackSpeechRecognition();
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      isRecording = false;
      setThinkingState();
    }

    // Web Speech API Fallback
    function fallbackSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('আপনার ব্রাউজারে মাইক্রোফোন পারমিশন এনাবল করুন অথবা নিচের ইনপুট বক্সে লিখুন।');
        resetState();
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'bn-BD';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isRecording = true;
        setListeningState();
      };

      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        dialogueText.innerText = `🗣️ "${transcript}"`;
        processTextQuery(transcript);
      };

      recognition.onerror = () => {
        resetState();
        dialogueText.innerText = "ভয়েস রেকর্ড করা যায়নি। নিচে লিখে পাঠান।";
      };

      recognition.onend = () => {
        isRecording = false;
      };

      try {
        recognition.start();
      } catch (e) {
        resetState();
      }
    }

    function setListeningState() {
      reactorCore.className = 'reactor-core listening';
      bottomMicBtn.className = 'mic-btn active';
      statusLabel.innerText = 'LISTENING';
      micIcon.innerText = '🔴';
      waveform.className = 'waveform active';
      dialogueText.innerText = "শুনছি রিফাত ভাই... কথা শেষ হলে আবার ট্যাপ করুন।";
    }

    function setThinkingState() {
      reactorCore.className = 'reactor-core thinking';
      bottomMicBtn.className = 'mic-btn';
      statusLabel.innerText = 'THINKING';
      micIcon.innerText = '🧠';
      waveform.className = 'waveform';
      dialogueText.innerText = "চিন্তা করছি এবং উত্তর প্রস্তুত করছি...";
    }

    function setSpeakingState() {
      reactorCore.className = 'reactor-core speaking';
      bottomMicBtn.className = 'mic-btn';
      statusLabel.innerText = 'SPEAKING';
      micIcon.innerText = '🔊';
      waveform.className = 'waveform active';
    }

    function resetState() {
      isRecording = false;
      reactorCore.className = 'reactor-core';
      bottomMicBtn.className = 'mic-btn';
      statusLabel.innerText = 'STANDBY';
      micIcon.innerText = '🎙️';
      waveform.className = 'waveform';
    }

    let selectedVoice = localStorage.getItem('jarvis_voice') || 'Puck';
    setVoice(selectedVoice);

    function setVoice(v) {
      selectedVoice = v;
      localStorage.setItem('jarvis_voice', v);
      ['voicePuck', 'voiceAoede', 'voiceCharon'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.remove('active');
      });
      const speakerEl = document.getElementById('speakerLabel');
      if (v === 'Puck') {
        document.getElementById('voicePuck')?.classList.add('active');
        if (speakerEl) speakerEl.innerHTML = '<span>🤖</span> JONSON CLOUD • GEMINI LIVE (PUCK)';
      } else if (v === 'Aoede') {
        document.getElementById('voiceAoede')?.classList.add('active');
        if (speakerEl) speakerEl.innerHTML = '<span>🤖</span> JONSON CLOUD • GEMINI LIVE (AOEDE)';
      } else if (v === 'Charon') {
        document.getElementById('voiceCharon')?.classList.add('active');
        if (speakerEl) speakerEl.innerHTML = '<span>🤖</span> JONSON CLOUD • BANGLA VOICE SKILL (CHARON)';
      }
    }

    // 2. Upload Audio Query (Direct to Gemini Multimodal Audio Transcriber)
    async function uploadAudioQuery(blob) {
      unlockAudio();
      setThinkingState();

      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64Audio = reader.result.split(',')[1];
        try {
          const res = await fetch('/api/jarvis/voice', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              audio: base64Audio,
              mimeType: blob.type || 'audio/webm',
              voice: selectedVoice
            })
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => null);
            dialogueText.innerText = errData?.error || "সার্ভার থেকে সঠিক রেসপন্স পাওয়া যায়নি।";
            resetState();
            return;
          }

          const data = await res.json();
          handleServerResponse(data);
        } catch (e) {
          console.error(e);
          dialogueText.innerText = "সার্ভারে কানেক্ট হতে সমস্যা হয়েছে।";
          resetState();
        }
      };
      reader.readAsDataURL(blob);
    }

    // 3. Process Text Query
    async function processTextQuery(query) {
      unlockAudio();
      setThinkingState();

      try {
        const res = await fetch('/api/jarvis/voice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: query,
            voice: selectedVoice
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => null);
          dialogueText.innerText = errData?.error || "সার্ভার থেকে সঠিক রেসপন্স পাওয়া যায়নি।";
          resetState();
          return;
        }

        const data = await res.json();
        handleServerResponse(data);
      } catch (e) {
        console.error(e);
        dialogueText.innerText = "সার্ভারে কানেক্ট হতে সমস্যা হয়েছে।";
        resetState();
      }
    }

    // 4. Handle Server Response & Play Natural Bangla Audio
    function handleServerResponse(data) {
      const reply = data.reply || 'কাজ সম্পন্ন হয়েছে!';
      dialogueText.innerHTML = reply.replace(/\n/g, '<br>');

      const spoken = data.spoken || reply;
      if (data.audioBase64) {
        playBanglaVoice(data.audioBase64, data.audioMime || 'audio/wav', spoken);
      } else {
        fallbackWebSpeech(spoken);
      }
    }

    function playBanglaVoice(base64Wav, mimeType, fallbackText = '') {
      if (currentAudio) {
        try { currentAudio.pause(); } catch(e){}
        currentAudio = null;
      }

      setSpeakingState();

      try {
        const audioUrl = `data:${mimeType};base64,${base64Wav}`;
        currentAudio = unlockedAudio || new Audio();
        currentAudio.src = audioUrl;

        currentAudio.onended = () => {
          resetState();
          currentAudio = null;
        };

        currentAudio.onerror = (e) => {
          console.warn('[AudioPlayError]', e);
          currentAudio = null;
          fallbackWebSpeech(fallbackText);
        };

        const playPromise = currentAudio.play();
        if (playPromise !== undefined) {
          playPromise.catch(err => {
            console.warn('[AutoplayPolicy]', err);
            fallbackWebSpeech(fallbackText);
          });
        }
      } catch (err) {
        fallbackWebSpeech(fallbackText);
      }
    }

    // Native Web Speech Fallback so Jarvis ALWAYS speaks out loud
    function fallbackWebSpeech(text) {
      if (!text || !('speechSynthesis' in window)) {
        resetState();
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const clean = text.replace(/<[^>]*>?/gm, '').replace(/[*#`_~]/g, '').trim();
        const utterance = new SpeechSynthesisUtterance(clean);
        utterance.lang = 'bn-BD';
        utterance.rate = 0.95;
        utterance.onend = () => resetState();
        utterance.onerror = () => resetState();
        setSpeakingState();
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        resetState();
      }
    }

    // 5. Input Submission
    function submitTextInput() {
      unlockAudio();
      const q = textInput.value.trim();
      if (!q) return;
      textInput.value = '';
      dialogueText.innerText = `🗣️ "${q}"`;
      processTextQuery(q);
    }

    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitTextInput();
    });

    function sendQuickPrompt(prompt) {
      unlockAudio();
      dialogueText.innerText = `🗣️ "${prompt}"`;
      processTextQuery(prompt);
    }
  </script>
</body>

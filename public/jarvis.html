<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>J.A.R.V.I.S. — Holographic Cyber HUD</title>
  
  <!-- Apple iOS PWA / Web App Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JARVIS">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/iron-man.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#020617">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #020617;
      --cyan: #00f2fe;
      --cyan-bright: #38bdf8;
      --cyan-glow: rgba(0, 242, 254, 0.55);
      --amber: #f59e0b;
      --crimson: #ff0055;
      --card-bg: rgba(6, 18, 38, 0.78);
      --border: rgba(0, 242, 254, 0.35);
      --border-bright: rgba(0, 242, 254, 0.75);
      --text: #f0fdfa;
      --text-dim: #94a3b8;
      --reactor-color: var(--cyan);
      --reactor-glow: var(--cyan-glow);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', 'Hind Siliguri', sans-serif;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-top: env(safe-area-inset-top, 10px);
      padding-bottom: env(safe-area-inset-bottom, 12px);
      position: relative;
    }

    /* Sci-Fi Cyber Grid & Scanline Background */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        linear-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 50% 35%, rgba(0, 242, 254, 0.12) 0%, transparent 68%),
                  radial-gradient(circle at 50% 90%, rgba(56, 189, 248, 0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Ambient Scanline overlay */
    .scanlines {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 1;
      pointer-events: none;
      opacity: 0.6;
    }

    /* Cyber Corners */
    .cyber-frame {
      position: fixed;
      pointer-events: none;
      z-index: 2;
    }
    .cf-tl { top: 8px; left: 8px; width: 24px; height: 24px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
    .cf-tr { top: 8px; right: 8px; width: 24px; height: 24px; border-top: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }
    .cf-bl { bottom: 8px; left: 8px; width: 24px; height: 24px; border-bottom: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
    .cf-br { bottom: 8px; right: 8px; width: 24px; height: 24px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }

    /* Top Holographic HUD Bar */
    header {
      position: relative;
      z-index: 10;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(0, 242, 254, 0.2);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: rgba(2, 6, 23, 0.7);
    }

    .brand-hud {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .reactor-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--cyan);
      box-shadow: 0 0 10px var(--cyan-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin-slow 10s linear infinite;
    }
    .reactor-icon::after {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 6px var(--cyan);
    }

    .brand-title {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 17px;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 0 0 12px var(--cyan-glow);
    }

    .brand-subtitle {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      color: var(--cyan);
      letter-spacing: 1.5px;
    }

    .hud-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
    }

    .hud-time {
      color: #38bdf8;
      letter-spacing: 1px;
    }

    .hud-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #10b981;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 3px 10px;
      border-radius: 14px;
      font-size: 10px;
      letter-spacing: 1px;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    /* Main Reactor Center Stage */
    main.viewport {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      gap: 16px;
    }

    /* Telemetry Side Tickers (Desktop / Tablet view) */
    .telemetry-row {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: space-between;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 1.2px;
      border-bottom: 1px dashed rgba(0, 242, 254, 0.15);
      padding-bottom: 4px;
    }

    .telemetry-row span b {
      color: var(--cyan);
      font-weight: normal;
    }

    /* ==========================================================================
       ORIGINAL IRON MAN ARC REACTOR HUD CORE (3D LAYERED HOLOGRAPHIC RINGS)
       ========================================================================== */
    .reactor-stage {
      position: relative;
      width: 250px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin: 6px 0;
    }

    /* Circular Audio Frequency Ring */
    .audio-visualizer-canvas {
      position: absolute;
      top: -20px;
      left: -20px;
      width: 290px;
      height: 290px;
      pointer-events: none;
      z-index: 1;
    }

    /* Outer Compass & Tick Ring */
    .ring-outer-compass {
      position: absolute;
      width: 244px;
      height: 244px;
      border-radius: 50%;
      border: 1px dashed rgba(0, 242, 254, 0.4);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
      animation: spin-clockwise 32s linear infinite;
    }
    .ring-outer-compass::before {
      content: "000°       090°       180°       270°";
      position: absolute;
      width: 100%;
      height: 100%;
      font-family: 'Share Tech Mono', monospace;
      font-size: 8px;
      color: rgba(0, 242, 254, 0.5);
      display: flex;
      align-items: center;
      justify-content: space-around;
      letter-spacing: 2px;
    }

    /* Secondary Segmented Ring */
    .ring-segments {
      position: absolute;
      width: 218px;
      height: 218px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top: 2px solid var(--reactor-color);
      border-bottom: 2px solid var(--reactor-color);
      box-shadow: 0 0 20px var(--reactor-glow);
      animation: spin-counter 14s linear infinite;
    }

    /* Segment Notch Markers */
    .ring-notches {
      position: absolute;
      width: 188px;
      height: 188px;
      border-radius: 50%;
      border: 1px dotted rgba(56, 189, 248, 0.6);
      animation: spin-clockwise 20s linear infinite;
    }

    /* Inner Turbine Facets / Capacitive Coil Ring */
    .ring-turbine {
      position: absolute;
      width: 154px;
      height: 154px;
      border-radius: 50%;
      border: 1px solid rgba(0, 242, 254, 0.5);
      background: radial-gradient(circle, rgba(0, 242, 254, 0.08) 0%, rgba(2, 6, 23, 0.9) 75%);
      box-shadow: inset 0 0 25px rgba(0, 242, 254, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin-counter 8s linear infinite;
    }

    .turbine-blade {
      position: absolute;
      width: 6px;
      height: 16px;
      background: linear-gradient(to top, var(--reactor-color), transparent);
      border-radius: 2px;
      box-shadow: 0 0 8px var(--reactor-glow);
    }
    .turbine-blade:nth-child(1) { transform: rotate(0deg) translateY(-66px); }
    .turbine-blade:nth-child(2) { transform: rotate(36deg) translateY(-66px); }
    .turbine-blade:nth-child(3) { transform: rotate(72deg) translateY(-66px); }
    .turbine-blade:nth-child(4) { transform: rotate(108deg) translateY(-66px); }
    .turbine-blade:nth-child(5) { transform: rotate(144deg) translateY(-66px); }
    .turbine-blade:nth-child(6) { transform: rotate(180deg) translateY(-66px); }
    .turbine-blade:nth-child(7) { transform: rotate(216deg) translateY(-66px); }
    .turbine-blade:nth-child(8) { transform: rotate(252deg) translateY(-66px); }
    .turbine-blade:nth-child(9) { transform: rotate(288deg) translateY(-66px); }
    .turbine-blade:nth-child(10) { transform: rotate(324deg) translateY(-66px); }

    /* The Central Palladium / Arc Core */
    .reactor-core {
      position: relative;
      z-index: 5;
      width: 104px;
      height: 104px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, var(--reactor-color) 45%, #031024 85%);
      box-shadow: 
        0 0 35px var(--reactor-glow),
        0 0 70px var(--reactor-glow),
        inset 0 0 20px #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .core-mic-icon {
      font-size: 34px;
      color: #020617;
      text-shadow: 0 0 10px #ffffff;
      transition: transform 0.25s ease;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.9));
    }

    .core-status-label {
      font-family: 'Orbitron', monospace;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #020617;
      margin-top: 4px;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.85);
      padding: 1px 6px;
      border-radius: 4px;
    }

    /* Core States */
    /* STANDBY (Cyan Chill) */
    .reactor-stage.standby {
      --reactor-color: var(--cyan);
      --reactor-glow: var(--cyan-glow);
    }

    /* LISTENING (Neon Crimson Recording Pulse) */
    .reactor-stage.listening {
      --reactor-color: #ff0055;
      --reactor-glow: rgba(255, 0, 85, 0.7);
    }
    .reactor-stage.listening .reactor-core {
      animation: core-record-pulse 0.9s infinite alternate;
    }
    .reactor-stage.listening .ring-segments {
      border-top-color: #ff0055;
      border-bottom-color: #ff0055;
      animation-duration: 3s;
    }

    /* THINKING (Gold High-Speed Computational Flux) */
    .reactor-stage.thinking {
      --reactor-color: #fbbf24;
      --reactor-glow: rgba(251, 191, 36, 0.7);
    }
    .reactor-stage.thinking .ring-turbine {
      animation-duration: 2s;
    }
    .reactor-stage.thinking .ring-segments {
      border-top-color: #fbbf24;
      border-bottom-color: #fbbf24;
      animation-duration: 2.5s;
    }

    /* SPEAKING (Vibrant Cyan Soundwave Radiation) */
    .reactor-stage.speaking {
      --reactor-color: #00f2fe;
      --reactor-glow: rgba(0, 242, 254, 0.9);
    }
    .reactor-stage.speaking .reactor-core {
      animation: core-speaking-pulse 0.6s infinite alternate;
    }

    @keyframes spin-clockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spin-counter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes spin-slow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes core-record-pulse {
      0% { transform: scale(0.96); box-shadow: 0 0 25px rgba(255, 0, 85, 0.5); }
      100% { transform: scale(1.06); box-shadow: 0 0 65px rgba(255, 0, 85, 0.95); }
    }
    @keyframes core-speaking-pulse {
      0% { transform: scale(0.98); box-shadow: 0 0 35px var(--cyan-glow); }
      100% { transform: scale(1.08); box-shadow: 0 0 85px var(--cyan-glow), inset 0 0 30px #ffffff; }
    }

    /* Holographic Dialogue HUD Card (Angled Cyber Edges) */
    .dialogue-cyber-box {
      width: 100%;
      max-width: 520px;
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(0, 242, 254, 0.05);
      clip-path: polygon(
        0 12px,
        12px 0,
        calc(100% - 12px) 0,
        100% 12px,
        100% calc(100% - 12px),
        calc(100% - 12px) 100%,
        12px 100%,
        0 calc(100% - 12px)
      );
    }

    .dialogue-cyber-box::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    }

    .dialogue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(0, 242, 254, 0.15);
    }

    .speaker-tag {
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .speaker-tag .radar-sweep {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      animation: pulse-dot 1.2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    .replay-pill {
      background: rgba(0, 242, 254, 0.15);
      border: 1px solid var(--border-bright);
      color: var(--cyan);
      border-radius: 8px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      padding: 4px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }
    .replay-pill:hover, .replay-pill:active {
      background: rgba(0, 242, 254, 0.3);
      box-shadow: 0 0 12px var(--cyan-glow);
    }

    .dialogue-body {
      font-family: 'Hind Siliguri', 'Rajdhani', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text);
      max-height: 130px;
      overflow-y: auto;
      text-shadow: 0 0 1px rgba(255, 255, 255, 0.3);
      padding-right: 4px;
    }
    .dialogue-body::-webkit-scrollbar {
      width: 4px;
    }
    .dialogue-body::-webkit-scrollbar-thumb {
      background: rgba(0, 242, 254, 0.3);
      border-radius: 4px;
    }

    /* Voice Persona Modulation Bar */
    .voice-matrix {
      display: flex;
      justify-content: center;
      gap: 8px;
      width: 100%;
      max-width: 520px;
      overflow-x: auto;
      padding: 0 4px;
    }
    .voice-matrix::-webkit-scrollbar { display: none; }

    .matrix-btn {
      flex: 1;
      min-width: 105px;
      background: rgba(6, 18, 38, 0.7);
      border: 1px solid rgba(0, 242, 254, 0.2);
      color: var(--text-dim);
      padding: 7px 8px;
      border-radius: 8px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: all 0.2s ease;
    }
    .matrix-btn span.name {
      font-weight: 700;
      color: #e2e8f0;
    }
    .matrix-btn span.role {
      font-size: 9px;
      color: var(--text-dim);
    }

    .matrix-btn.active {
      border-color: var(--cyan);
      background: rgba(0, 242, 254, 0.15);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.35);
    }
    .matrix-btn.active span.name {
      color: var(--cyan);
      text-shadow: 0 0 8px var(--cyan-glow);
    }

    /* Tactical Action Chips */
    .action-matrix {
      width: 100%;
      max-width: 520px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 4px;
      white-space: nowrap;
    }
    .action-matrix::-webkit-scrollbar { display: none; }

    .action-chip {
      background: rgba(6, 18, 38, 0.65);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #e0f2fe;
      padding: 6px 14px;
      border-radius: 18px;
      font-family: 'Hind Siliguri', 'Share Tech Mono', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .action-chip:hover, .action-chip:active {
      background: rgba(0, 242, 254, 0.2);
      border-color: var(--cyan);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
      transform: translateY(-1px);
    }

    /* Bottom Cyber Command Bar */
    footer.cyber-input-dock {
      position: relative;
      z-index: 10;
      padding: 10px 16px env(safe-area-inset-bottom, 12px) 16px;
      background: rgba(2, 6, 23, 0.85);
      border-top: 1px solid rgba(0, 242, 254, 0.2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      justify-content: center;
    }

    .input-wrapper {
      width: 100%;
      max-width: 520px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .mic-quick-btn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: rgba(6, 18, 38, 0.85);
      border: 1px solid var(--border);
      color: var(--cyan);
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .mic-quick-btn:active {
      transform: scale(0.92);
      border-color: var(--cyan);
      box-shadow: 0 0 15px var(--cyan-glow);
    }

    .cyber-text-field {
      flex: 1;
      height: 44px;
      background: rgba(6, 18, 38, 0.7);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 14px;
      color: #fff;
      font-family: 'Hind Siliguri', 'Rajdhani', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .cyber-text-field:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.35);
    }
    .cyber-text-field::placeholder {
      color: rgba(148, 163, 184, 0.6);
      font-size: 13px;
    }

    .cyber-send-btn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(56, 189, 248, 0.4));
      border: 1px solid var(--cyan);
      color: #fff;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .cyber-send-btn:active {
      transform: scale(0.92);
      box-shadow: 0 0 15px var(--cyan-glow);
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>

  <!-- HUD Corner Brackets -->
  <div class="cyber-frame cf-tl"></div>
  <div class="cyber-frame cf-tr"></div>
  <div class="cyber-frame cf-bl"></div>
  <div class="cyber-frame cf-br"></div>

  <!-- Top Header Telemetry -->
  <header>
    <div class="brand-hud">
      <div class="reactor-icon"></div>
      <div>
        <div class="brand-title">J.A.R.V.I.S.</div>
        <div class="brand-subtitle">MARK VII // CLOUD PROTOCOL</div>
      </div>
    </div>
    <div class="hud-meta">
      <span class="hud-time" id="hudClock">00:00:00 UTC</span>
      <div class="hud-status-badge">
        <span class="live-dot"></span> 24/7 ONLINE
      </div>
    </div>
  </header>

  <!-- Center Stage Viewport -->
  <main class="viewport">
    <!-- Diagnostics Line -->
    <div class="telemetry-row">
      <span>OWNER: <b>RIFAT UDDIN</b></span>
      <span>SYSTEM: <b>SOHOZKARBAR CORE</b></span>
      <span>AUDIO: <b>24kHz RIFF</b></span>
    </div>

    <!-- ARC REACTOR 3D HOLOGRAPHIC STAGE -->
    <div class="reactor-stage standby" id="reactorStage" title="কথা বলতে আর্করিয়েক্টরে ট্যাপ করুন">
      <canvas class="audio-visualizer-canvas" id="audioCanvas" width="290" height="290"></canvas>
      <div class="ring-outer-compass"></div>
      <div class="ring-segments"></div>
      <div class="ring-notches"></div>
      <div class="ring-turbine">
        <div class="turbine-blade"></div>
        <div class="turbine-blade"></div>
        <div class="turbine-blade"></div>
        <div class="turbine-blade"></div>
        <div class="turbine-blade"></div>
        <div class="turbine-blade"></div>
        <div class="turbine-blade"></div>
        <div class="turbine-blade"></div>
        <div class="turbine-blade"></div>
        <div class="turbine-blade"></div>
      </div>
      <div class="reactor-core" id="reactorCore">
        <div class="core-mic-icon" id="coreIcon">🎙️</div>
        <div class="core-status-label" id="statusLabel">STANDBY</div>
      </div>
    </div>

    <!-- DIALOGUE HOLOGRAPHIC CARD -->
    <div class="dialogue-cyber-box">
      <div class="dialogue-header">
        <div class="speaker-tag" id="speakerLabel">
          <span class="radar-sweep"></span>
          <span>JONSON CLOUD • BANGLA VOICE (KORE)</span>
        </div>
        <button class="replay-pill" id="replayBtn" onclick="replayLastVoice()" style="display:none;">
          🔊 আবার শুনুন
        </button>
      </div>
      <div class="dialogue-body" id="dialogueText">
        "আসসালামু আলাইকুম রিফাত ভাই। আমি সম্পূর্ণ প্রস্তুত। কথা বলতে আর্করিয়েক্টরে একবার ট্যাপ করুন।"
      </div>
    </div>

    <!-- VOICE MATRIX SELECTOR -->
    <div class="voice-matrix">
      <button class="matrix-btn active" id="voiceKore" onclick="setVoice('Kore')">
        <span class="name">👩 KORE</span>
        <span class="role">নারী • স্পষ্ট (ডিফল্ট)</span>
      </button>
      <button class="matrix-btn" id="voiceCharon" onclick="setVoice('Charon')">
        <span class="name">👨 CHARON</span>
        <span class="role">পুরুষ • রাশভারী</span>
      </button>
      <button class="matrix-btn" id="voicePuck" onclick="setVoice('Puck')">
        <span class="name">🎙️ PUCK</span>
        <span class="role">পুরুষ • ফ্রেন্ডলি</span>
      </button>
      <button class="matrix-btn" id="voiceAoede" onclick="setVoice('Aoede')">
        <span class="name">🌸 AOEDE</span>
        <span class="role">নারী • সফট</span>

    <!-- QUICK TACTICAL ACTION CHIPS -->
    <div class="action-matrix">
      <button class="action-chip" onclick="sendQuickPrompt('আজকের সহজ কারবার হিসাব ও কালেকশন কত?')">
        📊 আজকের কালেকশন
      </button>
      <button class="action-chip" onclick="sendQuickPrompt('আমার আজকের পেন্ডিং কাজের তালিকা দেখাও')">
        📋 পেন্ডিং টাস্ক
      </button>
      <button class="action-chip" onclick="sendQuickPrompt('মর্নিং এক্সিকিউটিভ ব্রিফিং দাও')">
        🌅 Morning Briefing
      </button>
      <button class="action-chip" onclick="sendQuickPrompt('সহজ কারবারের জন্য একটি ভাইরাল ফেসবুক পোস্টের আইডিয়া দাও')">
        ✍️ ভাইরাল আইডিয়া
      </button>
    </div>
  </main>

  <!-- BOTTOM COMMAND BAR -->
  <footer class="cyber-input-dock">
    <div class="input-wrapper">
      <button class="mic-quick-btn" id="bottomMicBtn" onclick="toggleRecording()" title="কথা বলুন">
        🎙️
      </button>
      <input 
        type="text" 
        class="cyber-text-field" 
        id="textInput" 
        placeholder="কমান্ড লিখুন বা রিএক্টরে ট্যাপ করুন..." 
        autocomplete="off"
      />
      <button class="cyber-send-btn" id="sendBtn" onclick="submitTextInput()" title="সেন্ড">
        ➤
      </button>
    </div>
  </footer>

  <script>
    // State management
    let isRecording = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let currentAudio = null;
    let audioCtx = null;
    let analyser = null;
    let animFrameId = null;
    let lastAudioBase64 = null;
    let lastAudioMime = 'audio/wav';
    let lastSpokenText = '';

    const reactorStage = document.getElementById('reactorStage');
    const reactorCore = document.getElementById('reactorCore');
    const statusLabel = document.getElementById('statusLabel');
    const coreIcon = document.getElementById('coreIcon');
    const dialogueText = document.getElementById('dialogueText');
    const speakerLabel = document.getElementById('speakerLabel');
    const textInput = document.getElementById('textInput');
    const replayBtn = document.getElementById('replayBtn');
    const audioCanvas = document.getElementById('audioCanvas');
    const canvasCtx = audioCanvas.getContext('2d');

    // Live Clock
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('hudClock').innerText = `${h}:${m}:${s} BDT`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Sci-Fi Sound Synthesizer (Web Audio API - Zero external files)
    function playSciFiChirp(type = 'activate') {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === 'activate') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(1180, now + 0.12);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'confirm') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(880, now);
          osc.frequency.exponentialRampToValueAtTime(1320, now + 0.1);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.13);
        }
      } catch(e) {}
    }

    // Audio Context & Unlocking
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function unlockAudio() {
      getAudioContext();
    }
    ['touchstart', 'touchend', 'mousedown', 'click'].forEach(evt => {
      window.addEventListener(evt, unlockAudio, { passive: true, once: true });
    });

    // Voice Selection Matrix
    let selectedVoice = localStorage.getItem('jarvis_voice') || 'Kore';
    setVoice(selectedVoice);

    function setVoice(v) {
      selectedVoice = v;
      localStorage.setItem('jarvis_voice', v);
      playSciFiChirp('activate');

      ['voiceKore', 'voiceCharon', 'voicePuck', 'voiceAoede'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.remove('active');
      });

      const activeEl = document.getElementById(`voice${v}`);
      if (activeEl) activeEl.classList.add('active');

      const names = {
        'Kore': 'JONSON CLOUD • BANGLA VOICE (KORE)',
        'Charon': 'JONSON CLOUD • BANGLA VOICE (CHARON)',
        'Puck': 'JONSON CLOUD • GEMINI LIVE (PUCK)',
        'Aoede': 'JONSON CLOUD • GEMINI LIVE (AOEDE)'
      };
      speakerLabel.innerHTML = `<span class="radar-sweep"></span><span>${names[v] || 'JONSON CLOUD'}</span>`;
    }

    // HUD Core States
    function setStandbyState() {
      isRecording = false;
      reactorStage.className = 'reactor-stage standby';
      statusLabel.innerText = 'STANDBY';
      coreIcon.innerText = '🎙️';
      stopCanvasVisualizer();
    }

    function setListeningState() {
      reactorStage.className = 'reactor-stage listening';
      statusLabel.innerText = 'LISTENING';
      coreIcon.innerText = '🔴';
      dialogueText.innerText = "শুনছি রিফাত ভাই... কথা শেষ হলে আবার ট্যাপ করুন।";
      startSimulatedWave(true);
    }

    function setThinkingState() {
      reactorStage.className = 'reactor-stage thinking';
      statusLabel.innerText = 'THINKING';
      coreIcon.innerText = '⚡';
      dialogueText.innerText = "প্রসেসিং এবং এনালাইসিস করছি...";
      stopCanvasVisualizer();
    }

    function setSpeakingState() {
      reactorStage.className = 'reactor-stage speaking';
      statusLabel.innerText = 'SPEAKING';
      coreIcon.innerText = '🔊';
      startSimulatedWave(false);
    }

    // Canvas Frequency Ring Visualizer
    function startSimulatedWave(isListening = false) {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      const centerX = audioCanvas.width / 2;
      const centerY = audioCanvas.height / 2;
      const radius = 126;
      const numBars = 48;
      let phase = 0;

      function render() {
        canvasCtx.clearRect(0, 0, audioCanvas.width, audioCanvas.height);
        phase += 0.08;

        for (let i = 0; i < numBars; i++) {
          const angle = (i / numBars) * Math.PI * 2;
          const amp = Math.sin(phase + i * 0.4) * Math.cos(phase * 0.5 + i * 0.2);
          const barHeight = Math.max(3, Math.abs(amp) * (isListening ? 16 : 24));

          const x1 = centerX + Math.cos(angle) * radius;
          const y1 = centerY + Math.sin(angle) * radius;
          const x2 = centerX + Math.cos(angle) * (radius + barHeight);
          const y2 = centerY + Math.sin(angle) * (radius + barHeight);

          canvasCtx.beginPath();
          canvasCtx.moveTo(x1, y1);
          canvasCtx.lineTo(x2, y2);
          canvasCtx.lineWidth = 2.5;
          canvasCtx.strokeStyle = isListening ? 'rgba(255, 0, 85, 0.75)' : 'rgba(0, 242, 254, 0.85)';
          canvasCtx.lineCap = 'round';
          canvasCtx.stroke();
        }

        animFrameId = requestAnimationFrame(render);
      }
      render();
    }

    function stopCanvasVisualizer() {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      canvasCtx.clearRect(0, 0, audioCanvas.width, audioCanvas.height);
    }

    // Toggle Voice Recording
    reactorStage.addEventListener('click', toggleRecording);

    async function toggleRecording() {
      unlockAudio();
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    }

    async function startRecording() {
      playSciFiChirp('activate');
      audioChunks = [];

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) audioChunks.push(event.data);
        };

        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(track => track.stop());
          const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          if (audioBlob.size > 800) {
            uploadAudioQuery(audioBlob);
          } else {
            setStandbyState();
            dialogueText.innerText = "ভয়েস পাওয়া যায়নি। আবার চেষ্টা করুন।";
          }
        };

        mediaRecorder.start();
        isRecording = true;
        setListeningState();
      } catch (err) {
        console.warn('[MicFallback]', err.message);
        fallbackSpeechRecognition();
      }
    }

    function stopRecording() {
      playSciFiChirp('confirm');
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      isRecording = false;
      setThinkingState();
    }

    function fallbackSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('মাইক্রোফোন পারমিশন এনাবল করুন অথবা নিচের বক্সে লিখে পাঠান।');
        setStandbyState();
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'bn-BD';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isRecording = true;
        setListeningState();
      };
      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        dialogueText.innerText = `🗣️ "${transcript}"`;
        processTextQuery(transcript);
      };
      recognition.onerror = () => {
        setStandbyState();
        dialogueText.innerText = "ভয়েস রেকর্ড করা যায়নি।";
      };
      recognition.onend = () => {
        isRecording = false;
      };

      try {
        recognition.start();
      } catch(e) {
        setStandbyState();
      }
    }

    // Direct Upload Audio Query to Server
    async function uploadAudioQuery(blob) {
      setThinkingState();
      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64Audio = reader.result.split(',')[1];
        try {
          const res = await fetch('/api/jarvis/voice', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              audio: base64Audio,
              mimeType: blob.type || 'audio/webm',
              voice: selectedVoice
            })
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => null);
            dialogueText.innerText = errData?.error || "সার্ভার থেকে সঠিক রেসপন্স পাওয়া যায়নি।";
            setStandbyState();
            return;
          }

          const data = await res.json();
          handleServerResponse(data);
        } catch (e) {
          console.error(e);
          dialogueText.innerText = "সার্ভারে কানেক্ট হতে সমস্যা হয়েছে।";
          setStandbyState();
        }
      };
      reader.readAsDataURL(blob);
    }

    // Process Text Query
    async function processTextQuery(query) {
      unlockAudio();
      setThinkingState();

      try {
        const res = await fetch('/api/jarvis/voice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: query,
            voice: selectedVoice
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => null);
          dialogueText.innerText = errData?.error || "সার্ভার থেকে সঠিক রেসপন্স পাওয়া যায়নি।";
          setStandbyState();
          return;
        }

        const data = await res.json();
        handleServerResponse(data);
      } catch (e) {
        console.error(e);
        dialogueText.innerText = "সার্ভারে কানেক্ট হতে সমস্যা হয়েছে।";
        setStandbyState();
      }
    }

    // Handle Server Response & Audio Output
    function handleServerResponse(data) {
      const reply = data.reply || 'কাজ সম্পন্ন হয়েছে!';
      dialogueText.innerHTML = reply.replace(/\n/g, '<br>');

      const spoken = data.spoken || reply;
      lastSpokenText = spoken;

      if (data.audioBase64) {
        lastAudioBase64 = data.audioBase64;
        lastAudioMime = data.audioMime || 'audio/wav';
        replayBtn.style.display = 'inline-flex';
        playBanglaVoice(data.audioBase64, lastAudioMime, spoken);
      } else {
        fallbackWebSpeech(spoken);
      }
    }

    function base64ToArrayBuffer(base64) {
      const binaryString = window.atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    function replayLastVoice() {
      if (lastAudioBase64) {
        playSciFiChirp('activate');
        playBanglaVoice(lastAudioBase64, lastAudioMime, lastSpokenText);
      }
    }

    async function playBanglaVoice(base64Wav, mimeType, fallbackText = '') {
      if (currentAudio) {
        try { currentAudio.pause(); } catch(e){}
        currentAudio = null;
      }

      setSpeakingState();

      // Tier 1: Web Audio API (Crystal clear, lowest latency, zero iOS autoplay blockage)
      try {
        const ctx = getAudioContext();
        if (ctx) {
          const ab = base64ToArrayBuffer(base64Wav);
          const decoded = await ctx.decodeAudioData(ab.slice(0));
          const source = ctx.createBufferSource();
          source.buffer = decoded;
          source.connect(ctx.destination);
          source.onended = () => {
            setStandbyState();
          };
          source.start(0);
          return;
        }
      } catch (ctxErr) {
        console.warn('[WebAudioDecodeNotice] Fallback to HTML5 Audio:', ctxErr.message);
      }

      // Tier 2: HTML5 Audio via Blob URL
      try {
        const rawBytes = base64ToArrayBuffer(base64Wav);
        const blob = new Blob([rawBytes], { type: mimeType || 'audio/wav' });
        const blobUrl = URL.createObjectURL(blob);
        const audio = new Audio(blobUrl);
        currentAudio = audio;

        audio.onended = () => {
          setStandbyState();
          currentAudio = null;
          URL.revokeObjectURL(blobUrl);
        };
        audio.onerror = () => {
          URL.revokeObjectURL(blobUrl);
          fallbackWebSpeech(fallbackText);
        };

        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => fallbackWebSpeech(fallbackText));
        }
      } catch (err) {
        fallbackWebSpeech(fallbackText);
      }
    }

    function fallbackWebSpeech(text) {
      if (!text || !('speechSynthesis' in window)) {
        setStandbyState();
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const clean = text.replace(/<[^>]*>?/gm, '').replace(/[*#`_~]/g, '').trim();
        const utterance = new SpeechSynthesisUtterance(clean);
        utterance.lang = 'bn-BD';
        utterance.rate = 0.95;
        utterance.onend = () => setStandbyState();
        utterance.onerror = () => setStandbyState();
        setSpeakingState();
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        setStandbyState();
      }
    }

    // Input handlers
    function submitTextInput() {
      unlockAudio();
      const q = textInput.value.trim();
      if (!q) return;
      playSciFiChirp('activate');
      textInput.value = '';
      dialogueText.innerText = `🗣️ "${q}"`;
      processTextQuery(q);
    }

    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitTextInput();
    });

    function sendQuickPrompt(prompt) {
      unlockAudio();
      playSciFiChirp('activate');
      dialogueText.innerText = `🗣️ "${prompt}"`;
      processTextQuery(prompt);
    }
  </script>
